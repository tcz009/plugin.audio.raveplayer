name: build

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s test -v

      - name: Validate addon.xml
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          plugin = ET.parse("addon.xml").getroot()
          assert plugin.get("id") == "plugin.audio.raveplayer"
          screen = ET.parse("script.raveplayer.ui/addon.xml").getroot()
          assert screen.get("id") == "script.raveplayer.ui"
          imports = {item.get("addon"): item.get("version")
                     for item in screen.findall("./requires/import")}
          assert imports.get("plugin.audio.raveplayer") == plugin.get("version")
          print("addon.xml ok, plugin", plugin.get("version"),
                "screen", screen.get("version"))
          PY

      - name: Build installable zip
        run: |
          chmod +x scripts/build.sh scripts/build-repo.sh scripts/check-repo-artifacts.sh
          ./scripts/build.sh
          ./scripts/build-repo.sh

      - name: Verify committed repo artifacts
        # repo/ is generated but must be committed for Kodi auto-updates. Do not
        # compare binary zips (timestamps churn); only the catalogue text and
        # the tracked current add-on zips are checked.
        run: ./scripts/check-repo-artifacts.sh

      - uses: actions/upload-artifact@v4
        with:
          name: raveplayer-addons
          path: |
            dist/*.zip
            repo/repository.raveplayer/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # A zip can exist in both dist/ and repo/; globbing repo/*/*.zip
          # uploaded the same asset name twice and made the release step fail
          # with "update-a-release-asset Not Found" on v3.9.4.
          files: |
            dist/*.zip
            repo/repository.raveplayer/*.zip
